[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qeclang"
version = "0.1.0"
description = "Structured quantum error correction primitives and certified small-code analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
numeric = ["numpy>=1.24", "scipy>=1.11"]
sdp = ["numpy>=1.24", "cvxpy>=1.4", "scs>=3.2"]
circuits = ["numpy>=1.24", "stim==1.16.0"]
qldpc = ["qldpc==0.4.1"]
dev = ["pytest>=8", "ruff>=0.9", "numpy>=1.24", "scipy>=1.11"]

[project.scripts]
qeclang = "qeclang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
