name: External CSS comparison
on: [push, pull_request]
jobs:
  qldpc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[qldpc]' pytest
      - run: python -m pytest -q tests/test_qldpc_adapter.py tests/test_qldpc_comparison.py
