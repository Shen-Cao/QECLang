name: Formal witnesses
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          use-mathlib-cache: false
      - run: python -m pip install -e . pytest
      - run: python scripts/check_formal.py
      - run: python -m pytest tests/test_lean_export.py
        env:
          QECLANG_TEST_LEAN: "1"
